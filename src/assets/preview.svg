<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="wallBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ebe2"/>
      <stop offset="100%" stop-color="#e8e0d4"/>
    </linearGradient>
    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9ad90"/>
      <stop offset="100%" stop-color="#9a7a5a"/>
    </linearGradient>
    <linearGradient id="sofaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6c4a8"/>
      <stop offset="100%" stop-color="#b8a080"/>
    </linearGradient>
    <linearGradient id="winG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e0f0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e0f0fa" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Wall -->
  <rect width="1600" height="900" fill="url(#wallBg)"/>

  <!-- Wall panel lines -->
  <rect x="40" y="40" width="1520" height="640" fill="none" stroke="#ddd4c4" stroke-width="2"/>
  <rect x="70" y="70" width="1460" height="580" fill="none" stroke="#e0d8c8" stroke-width="1"/>

  <!-- Large window -->
  <rect x="1100" y="60" width="420" height="580" rx="8" fill="url(#winG)"/>
  <rect x="1100" y="60" width="420" height="580" rx="8" fill="none" stroke="#c8b99a" stroke-width="4"/>
  <line x1="1310" y1="60" x2="1310" y2="640" stroke="#c8b99a" stroke-width="2"/>
  <line x1="1100" y1="350" x2="1520" y2="350" stroke="#c8b99a" stroke-width="2"/>
  <!-- Curtains -->
  <path d="M1100,60 Q1070,300 1085,640 L1100,640 L1100,60Z" fill="#e0ccb0" opacity="0.85"/>
  <path d="M1520,60 Q1550,300 1535,640 L1520,640 L1520,60Z" fill="#e0ccb0" opacity="0.85"/>

  <!-- Art wall left -->
  <rect x="120" y="120" width="280" height="360" rx="4" fill="#2c1a0e" stroke="#c8a855" stroke-width="8"/>
  <rect x="136" y="136" width="248" height="328" rx="2" fill="#3a2518"/>
  <ellipse cx="260" cy="300" rx="90" ry="110" fill="#5a3828" opacity="0.7"/>
  <path d="M160,250 Q260,190 360,250 Q320,320 260,340 Q200,320 160,250Z" fill="#8b6040" opacity="0.5"/>
  <circle cx="260" cy="270" r="40" fill="#c4a060" opacity="0.3"/>

  <!-- Floor -->
  <rect x="0" y="680" width="1600" height="220" fill="url(#floorG)"/>
  <!-- Wood planks -->
  <line x1="0" y1="700" x2="1600" y2="700" stroke="#a07850" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="730" x2="1600" y2="730" stroke="#a07850" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="760" x2="1600" y2="760" stroke="#a07850" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="790" x2="1600" y2="790" stroke="#a07850" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="680" x2="200" y2="900" stroke="#a07850" stroke-width="0.7" opacity="0.4"/>
  <line x1="400" y1="680" x2="400" y2="900" stroke="#a07850" stroke-width="0.7" opacity="0.4"/>
  <line x1="600" y1="680" x2="600" y2="900" stroke="#a07850" stroke-width="0.7" opacity="0.4"/>
  <line x1="800" y1="680" x2="800" y2="900" stroke="#a07850" stroke-width="0.7" opacity="0.4"/>
  <line x1="1000" y1="680" x2="1000" y2="900" stroke="#a07850" stroke-width="0.7" opacity="0.4"/>
  <line x1="1200" y1="680" x2="1200" y2="900" stroke="#a07850" stroke-width="0.7" opacity="0.4"/>
  <line x1="1400" y1="680" x2="1400" y2="900" stroke="#a07850" stroke-width="0.7" opacity="0.4"/>

  <!-- Rug -->
  <ellipse cx="680" cy="760" rx="500" ry="120" fill="#b8987a" opacity="0.35"/>
  <ellipse cx="680" cy="760" rx="460" ry="100" fill="none" stroke="#c8a88a" stroke-width="3" opacity="0.4"/>
  <ellipse cx="680" cy="760" rx="400" ry="80" fill="none" stroke="#d8b89a" stroke-width="1.5" opacity="0.3"/>

  <!-- Sofa -->
  <rect x="280" y="540" width="800" height="30" rx="6" fill="#b8a080"/>
  <rect x="260" y="450" width="840" height="100" rx="12" fill="url(#sofaG)"/>
  <rect x="260" y="445" width="840" height="20" rx="8" fill="#c8b090"/>
  <!-- Sofa arms -->
  <rect x="260" y="450" width="60" height="100" rx="8" fill="#c0a878"/>
  <rect x="1040" y="450" width="60" height="100" rx="8" fill="#c0a878"/>
  <!-- Cushions -->
  <rect x="300" y="460" width="220" height="80" rx="10" fill="#d8c4a4"/>
  <rect x="550" y="460" width="260" height="80" rx="10" fill="#cdb89a"/>
  <rect x="840" y="460" width="220" height="80" rx="10" fill="#d8c4a4"/>
  <!-- Sofa legs -->
  <rect x="280" y="570" width="20" height="40" rx="3" fill="#6a4a2a"/>
  <rect x="1060" y="570" width="20" height="40" rx="3" fill="#6a4a2a"/>
  <rect x="520" y="570" width="20" height="40" rx="3" fill="#6a4a2a"/>
  <rect x="820" y="570" width="20" height="40" rx="3" fill="#6a4a2a"/>

  <!-- Coffee table -->
  <rect x="440" y="615" width="480" height="18" rx="4" fill="#8a6040"/>
  <rect x="440" y="611" width="480" height="8" rx="3" fill="#a07858"/>
  <rect x="460" y="633" width="14" height="45" rx="3" fill="#6a4828"/>
  <rect x="886" y="633" width="14" height="45" rx="3" fill="#6a4828"/>
  <!-- Table decor -->
  <ellipse cx="660" cy="614" rx="60" ry="15" fill="#c8b090" opacity="0.4"/>
  <circle cx="660" cy="605" r="22" fill="#a8c4b0" opacity="0.7"/>
  <ellipse cx="780" cy="614" rx="35" ry="12" fill="#c8b090" opacity="0.3"/>
  <rect x="762" y="590" width="36" height="22" rx="3" fill="#d4c8a8" opacity="0.8"/>

  <!-- Floor lamp -->
  <rect x="1050" y="360" width="6" height="280" rx="3" fill="#8a7060"/>
  <ellipse cx="1053" cy="360" rx="55" ry="25" fill="#e8d8b0" opacity="0.9"/>
  <ellipse cx="1053" cy="385" rx="55" ry="8" fill="#d4c090" opacity="0.6"/>
  <ellipse cx="1053" cy="640" rx="40" ry="12" fill="#7a6050"/>

  <!-- Baseboard -->
  <rect x="0" y="670" width="1600" height="14" fill="#ddd4c4"/>
</svg>
