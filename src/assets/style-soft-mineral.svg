<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8ddd0"/>
      <stop offset="100%" stop-color="#c9b89a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c4b0"/>
      <stop offset="100%" stop-color="#b8a58a"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4925a"/>
      <stop offset="100%" stop-color="#a07040"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#bg)"/>

  <!-- Stone panel top -->
  <rect x="0" y="0" width="300" height="170" fill="url(#stone)"/>
  <!-- Stone texture lines -->
  <line x1="0" y1="40" x2="300" y2="40" stroke="#c0b0a0" stroke-width="1.5" opacity="0.6"/>
  <line x1="0" y1="85" x2="300" y2="85" stroke="#c0b0a0" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="125" x2="300" y2="125" stroke="#bfb0a0" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="0" x2="60" y2="85" stroke="#c0b0a0" stroke-width="1" opacity="0.4"/>
  <line x1="160" y1="40" x2="160" y2="125" stroke="#c0b0a0" stroke-width="1" opacity="0.4"/>
  <line x1="90" y1="85" x2="90" y2="170" stroke="#c0b0a0" stroke-width="1" opacity="0.4"/>
  <line x1="220" y1="85" x2="220" y2="170" stroke="#c0b0a0" stroke-width="1" opacity="0.4"/>

  <!-- Oak shelf / divider -->
  <rect x="0" y="165" width="300" height="24" fill="url(#oak)"/>
  <rect x="0" y="165" width="300" height="5" fill="#d4a870" opacity="0.7"/>
  <!-- Oak grain lines -->
  <line x1="0" y1="172" x2="300" y2="172" stroke="#c48050" stroke-width="0.7" opacity="0.5"/>
  <line x1="0" y1="179" x2="300" y2="179" stroke="#b87040" stroke-width="0.7" opacity="0.5"/>
  <line x1="0" y1="184" x2="300" y2="184" stroke="#c08050" stroke-width="0.5" opacity="0.4"/>

  <!-- Oak floor bottom -->
  <rect x="0" y="189" width="300" height="111" fill="#b88050"/>
  <!-- Floor planks -->
  <line x1="0" y1="210" x2="300" y2="210" stroke="#a07040" stroke-width="1.2" opacity="0.5"/>
  <line x1="0" y1="235" x2="300" y2="235" stroke="#a07040" stroke-width="1.2" opacity="0.5"/>
  <line x1="0" y1="260" x2="300" y2="260" stroke="#a07040" stroke-width="1.2" opacity="0.5"/>
  <line x1="0" y1="285" x2="300" y2="285" stroke="#a07040" stroke-width="1.2" opacity="0.5"/>
  <line x1="80" y1="189" x2="80" y2="300" stroke="#a07040" stroke-width="0.8" opacity="0.4"/>
  <line x1="175" y1="189" x2="175" y2="300" stroke="#a07040" stroke-width="0.8" opacity="0.4"/>
  <line x1="250" y1="189" x2="250" y2="300" stroke="#a07040" stroke-width="0.8" opacity="0.4"/>

  <!-- Decorative vase on shelf -->
  <ellipse cx="80" cy="166" rx="18" ry="6" fill="#c4a07a" opacity="0.6"/>
  <path d="M66,166 Q62,140 70,128 Q80,118 90,128 Q98,140 94,166Z" fill="#d4b08a"/>
  <ellipse cx="80" cy="128" rx="12" ry="5" fill="#e0c09a"/>

  <!-- Small plant -->
  <ellipse cx="220" cy="165" rx="14" ry="5" fill="#9ab08a" opacity="0.5"/>
  <path d="M216,165 Q212,148 220,140 Q228,148 224,165Z" fill="#7a9a6a"/>
  <path d="M210,160 Q200,148 208,138 Q216,150 214,162Z" fill="#6a8a5a"/>
  <path d="M226,160 Q238,148 230,140 Q222,150 224,162Z" fill="#7a9a6a"/>

  <!-- Label area -->
  <rect x="0" y="255" width="300" height="45" fill="rgba(0,0,0,0.25)"/>
  <text x="150" y="276" font-family="Georgia, serif" font-size="13" fill="white" text-anchor="middle" font-weight="500">Soft Mineral</text>
  <text x="150" y="292" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.75)" text-anchor="middle">Warm stone + oak</text>
</svg>
